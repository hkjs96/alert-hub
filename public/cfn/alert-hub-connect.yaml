AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  alert-hub connect - SNS subscription that forwards CloudWatch alarms to alert-hub, plus a read-only role for alarm graphs.
  Deleting this stack removes everything it created (alarm settings are never modified).

Parameters:
  IngestUrl:
    Type: String
    Description: Customer-specific ingest URL issued by alert-hub (.../api/webhooks/cloudwatch?token=in_...)
    AllowedPattern: "^https://.+/api/webhooks/cloudwatch\\?token=in_[0-9a-f]{40}$"
  ExistingTopicArn:
    Type: String
    Default: ""
    Description: ARN of the SNS topic your alarms already notify. If set, only a subscription is added to it (alarms unchanged). If empty, a new topic named alert-hub is created.
  HubRoleArn:
    Type: String
    Description: alert-hub hub role ARN (alert-hub-vercel in the MSP account)
    AllowedPattern: "^arn:aws:iam::\\d{12}:role/.+$"
  ExternalId:
    Type: String
    Description: ExternalId issued by alert-hub for this customer
    AllowedPattern: "^ah-[0-9a-f]{32}$"
  CreateReaderRole:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the read-only graph role alert-hub-reader. IAM is global, so set false for stacks in additional regions.

Conditions:
  UseExistingTopic: !Not [!Equals [!Ref ExistingTopicArn, ""]]
  MakeTopic: !Equals [!Ref ExistingTopicArn, ""]
  MakeRole: !Equals [!Ref CreateReaderRole, "true"]

Resources:
  AlertHubTopic:
    Type: AWS::SNS::Topic
    Condition: MakeTopic
    Properties:
      TopicName: alert-hub
      DisplayName: alert-hub

  AlertHubSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      Protocol: https
      Endpoint: !Ref IngestUrl
      TopicArn: !If [UseExistingTopic, !Ref ExistingTopicArn, !Ref AlertHubTopic]

  AlertHubReaderRole:
    Type: AWS::IAM::Role
    Condition: MakeRole
    Properties:
      RoleName: alert-hub-reader
      Description: alert-hub read-only role for alarm graphs and EC2 Name tags (GetMetricWidgetImage, DescribeTags)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { AWS: !Ref HubRoleArn }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                sts:ExternalId: !Ref ExternalId
      Policies:
        - PolicyName: alert-hub-graph
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:GetMetricWidgetImage
                  - ec2:DescribeTags
                Resource: "*"

Outputs:
  TopicArn:
    Description: SNS topic that forwards alarms to alert-hub - if newly created, add it to your alarm actions
    Value: !If [UseExistingTopic, !Ref ExistingTopicArn, !Ref AlertHubTopic]
  ReaderRoleArn:
    Condition: MakeRole
    Value: !GetAtt AlertHubReaderRole.Arn
